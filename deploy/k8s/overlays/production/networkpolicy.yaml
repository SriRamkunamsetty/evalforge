apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: evalforge-netpol
spec:
  podSelector:
    matchLabels:
      app: evalforge
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8083
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: TCP
          port: 443

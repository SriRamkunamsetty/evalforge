apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: evalforge
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - evalforge.example.com
      secretName: evalforge-tls
  rules:
    - host: evalforge.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: evalforge
                port:
                  number: 8083

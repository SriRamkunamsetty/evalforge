# EvalForge Enterprise Helm Values
replicaCount: 2

image:
  repository: ghcr.io/sriramkunamsetty/evalforge
  tag: "0.1.0"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

# Existing Kubernetes Secret containing API_KEY and SECRET_KEY
# Pre-create: kubectl create secret generic evalforge-secrets --from-literal=API_KEY=... --from-literal=SECRET_KEY=...
existingSecret: evalforge-secrets

env:
  COOKIE_SECURE: "1"
  RATE_LIMIT_PER_MIN: "240"
  TRUST_PROXY: "1"

worker:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: evalforge.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: evalforge-tls
      hosts:
        - evalforge.example.com

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true

serviceMonitor:
  enabled: true
  interval: 15s
  scrapeTimeout: 10s

persistence:
  enabled: true
  size: 10Gi
  accessModes:
    - ReadWriteOnce
  storageClass: ""

service:
  type: ClusterIP
  port: 8083

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001

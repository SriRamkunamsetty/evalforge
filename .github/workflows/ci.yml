name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  test:
    name: Test & DevSecOps (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: "pip"
      - run: pip install -r requirements-dev.txt
      - name: Lint with Ruff
        run: ruff check .
      - name: SAST Security Scan (Bandit)
        run: bandit -r evalforge -ll -ii
      - name: Test Suite & Code Coverage
        run: python -m pytest --cov=evalforge --cov-fail-under=80

  docker:
    name: Container Security & Smoke Test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Container Image
        run: docker build -t evalforge:ci .
      - name: Smoke Test Container Runtime
        run: |
          docker run -d --name app -p 8083:8083 -e API_KEY=ci-key -e SECRET_KEY=ci-secret evalforge:ci
          for i in $(seq 1 20); do curl -fs localhost:8083/healthz && break || sleep 1; done
          curl -fsS localhost:8083/healthz
      - name: Scan Image for Vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: evalforge:ci
          severity: CRITICAL,HIGH
          exit-code: "1"

  helm:
    name: Kubernetes Helm Chart Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint Helm Chart
        run: helm lint deploy/helm/evalforge
      - name: Template Helm Chart
        run: helm template evalforge deploy/helm/evalforge
